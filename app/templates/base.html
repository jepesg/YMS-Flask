<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortYard - YMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/global.css') }}">
</head>
<body>

<div class="sidebar">
    <div class="logo">
        <i class="fas fa-shield-alt"></i>
    </div>

    <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}" title="Dashboard">
        <i class="fas fa-chart-line"></i>
    </a>
        <a href="{{ url_for('gerenciamento') }}" title="Gerenciamento">
        <i class="fas fa-tachometer-alt"></i>
    </a>

    <a href="{{ url_for('entrada') }}" class="{% if request.endpoint == 'entrada' %}active{% endif %}" title="Registrar Entrada">
        <i class="fas fa-plus-circle"></i>
    </a>

    <a href="{{ url_for('config_docas') }}" class="{% if request.endpoint == 'config_docas' %}active{% endif %}" title="Configurações">
        <i class="fas fa-cogs"></i>
    </a>

    <a href="{{ url_for('logout') }}" title="Sair">
        <i class="fas fa-sign-out-alt"></i>
    </a>
</div>

    <div class="content-area">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
